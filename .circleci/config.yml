version: 2.1

# The setup half of every pipeline: the ci config always, and the image's
# (docker/.circleci/config.yml) when the push changed docker/ or setup.sh, the
# two merged; plus the tag of CI's image for the Dockerfile and QEMU base at
# this commit, so the ci config pulls the right one.
setup: true

orbs:
  path-filtering: circleci/path-filtering@1
  continuation: circleci/continuation@1

jobs:
  setup:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - path-filtering/set-parameters:
          base-revision: main
          mapping: |
            .* ci true .circleci/ci.yml
            (docker/.*|setup\.sh) build-image true docker/.circleci/config.yml
          config-path: .circleci/ci.yml
          output-path: /tmp/pipeline-parameters.json
      - run:
          name: CI's image tag
          command: |
            base=$(sed -n 's/.*--branch \(v[0-9.]*\).*/\1/p' setup.sh | head -1)
            tag=$({ cat docker/Dockerfile; echo "$base"; } | sha256sum | cut -c1-12)
            python3 -c "import json; p = json.load(open('/tmp/pipeline-parameters.json')); p['image'] = 'unfr0zen/qemu-build:$tag'; json.dump(p, open('/tmp/pipeline-parameters.json', 'w')); print(p)"
      - path-filtering/generate-config:
          config-list-path: /tmp/filtered-config-list
          generated-config-path: /tmp/generated-config.yml
      - continuation/continue:
          configuration_path: /tmp/generated-config.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - setup
