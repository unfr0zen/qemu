version: 2.1

# The patch stack on the QEMU it is written against (setup.sh's base), and the
# host-side scripts: on every pull request and push to main. The patches build
# in CI's image (docker/Dockerfile's ci stage, docker/.circleci/config.yml),
# which holds the base already compiled through ccache, so only what the stack
# touches compiles again. .circleci/config.yml continues into this file with
# image naming that image for the Dockerfile and base at this commit, and
# build-image when docker/ or setup.sh changed, so the image is being built in
# this pipeline and the gate waits for it.

parameters:
  ci:
    type: boolean
    default: false
  build-image:
    type: boolean
    default: false
  image:
    description: CI's image, unfr0zen/qemu-build at the Dockerfile and base's tag.
    type: string
    default: ""

executors:
  qemu-build:
    docker:
      - image: << pipeline.parameters.image >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_TOKEN
    resource_class: arm.large.gen2
  ubuntu:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium.gen2

jobs:
  # The gate: the image for this Dockerfile and base is on Docker Hub. When
  # this push changed docker/ or setup.sh, the build-image workflow is
  # publishing it in this same pipeline, so wait for it; otherwise a missing
  # image is an error.
  image-ready:
    executor: ubuntu
    environment:
      IMAGE: << pipeline.parameters.image >>
      IMAGE_BUILDING: << pipeline.parameters.build-image >>
    steps:
      - run:
          name: Wait for << pipeline.parameters.image >>
          no_output_timeout: 60m
          command: |
            [ -n "$IMAGE" ] || { echo "no image parameter: the setup workflow sets it"; exit 1; }
            repo=${IMAGE%%:*}; tag=${IMAGE#*:}
            for attempt in $(seq 1 110); do
              curl -fsS -o /tmp/token.json -u "$DOCKERHUB_USER:$DOCKERHUB_TOKEN" \
                "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repo:pull" \
                || { echo "Docker Hub refused the docker-hub context's DOCKERHUB_USER and DOCKERHUB_TOKEN"; exit 1; }
              token=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])' < /tmp/token.json)
              status=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://registry-1.docker.io/v2/$repo/manifests/$tag")
              case $status in
                200) echo "$IMAGE is on Docker Hub"; exit 0 ;;
                404)
                  if [ "$IMAGE_BUILDING" = true ]; then
                    echo "$IMAGE is not on Docker Hub yet; the build-image workflow is making it ($attempt)"
                    sleep 30
                  else
                    echo "$IMAGE is not on Docker Hub. It is built when a push changes docker/ or setup.sh; rerun that workflow or push a change there."
                    exit 1
                  fi ;;
                *) echo "Docker Hub answered $status for $IMAGE"; exit 1 ;;
              esac
            done
            echo "gave up waiting for $IMAGE"; exit 1

  # The patches: numbered without gaps, applying one at a time in order, clean
  # under QEMU's checkpatch where this change touches them, and building; then
  # the machines under the host-side tests and QEMU's own ARM qtests.
  patches:
    executor: qemu-build
    steps:
      - checkout
      - run:
          name: Numbering
          command: |
            n=0
            for p in patches/*.patch; do
              n=$((n + 1))
              want=$(printf '%04d-' "$n")
              case "$(basename "$p")" in
                "$want"*) ;;
                *) echo "$p: expected a name starting $want"; exit 1 ;;
              esac
            done
            echo "$n patches, numbered 0001 to $(printf '%04d' "$n")"
      # The image's clone of the base, in place of setup.sh's own, which it
      # finds already there.
      - run:
          name: QEMU
          command: |
            base=$(sed -n 's/.*--branch \(v[0-9.]*\).*/\1/p' setup.sh | head -1)
            [ "$(cat /opt/qemu-base)" = "$base" ] || { echo "the image holds QEMU $(cat /opt/qemu-base), setup.sh wants $base"; exit 1; }
            mv /opt/qemu qemu-src
      # One at a time, as setup.sh applies them: a later patch may touch a
      # file an earlier one creates.
      - run:
          name: Apply
          command: |
            for p in patches/*.patch; do
              git -C qemu-src apply "$PWD/$p" || { echo "$p does not apply"; exit 1; }
            done
      # The stack predates checkpatch here, so only the patches this change
      # adds or edits, against main (or the push before, on main itself), must
      # be free of errors; every patch's result is listed.
      - run:
          name: checkpatch
          command: |
            git fetch --quiet origin main
            base=$(git merge-base origin/main HEAD)
            [ "$base" != "$(git rev-parse HEAD)" ] || base=$(git rev-parse HEAD~1)
            changed=$(git diff --name-only --diff-filter=AM "$base" HEAD -- patches/)
            fail=0
            for p in patches/*.patch; do
              out=$(perl qemu-src/scripts/checkpatch.pl --no-signoff -q "$p" 2>&1) || true
              total=$(printf '%s\n' "$out" | grep '^total:' || echo 'total: clean')
              echo "$(basename "$p"): $total"
              if printf '%s\n' "$changed" | grep -qx "$p" && printf '%s\n' "$out" | grep -q '^ERROR:'; then
                printf '%s\n' "$out"
                echo "$p: checkpatch errors"
                fail=1
              fi
            done
            exit $fail
      # Through the image's ccache: the base's objects are hits.
      - run:
          name: Build
          no_output_timeout: 30m
          command: |
            ccache -z
            ./setup.sh
            ccache -s
      - run:
          name: UDC bridge
          command: QEMU_SYSTEM_ARM="$PWD/qemu-src/build/qemu-system-arm" python3 -m pytest tests/test_cihdrc_bridge.py --junitxml=.work/test-results/udc/junit.xml
      - run:
          name: GDB protocol on virt and flintstone
          command: QEMU_SYSTEM_ARM="$PWD/qemu-src/build/qemu-system-arm" python3 -m pytest tests/test_gdb*.py --junitxml=.work/test-results/gdb/junit.xml
      # QEMU's own ARM tests: the stack changes models upstream boards share
      # (the i.MX watchdog, I2C and uSDHC among them), and qom-test and
      # test-hmp build every machine, flintstone and j49 included. meson
      # writes their JUnit report itself.
      - run:
          name: qtest
          no_output_timeout: 30m
          command: |
            ninja -C qemu-src/build
            status=0
            (cd qemu-src/build && ./pyvenv/bin/meson test --suite qtest-arm --no-rebuild --print-errorlogs) || status=$?
            mkdir -p .work/test-results/qtest && cp qemu-src/build/meson-logs/testlog.junit.xml .work/test-results/qtest/junit.xml
            exit $status
      - store_test_results:
          path: .work/test-results

  # The host-side Python and shell: syntax, pyflakes on a pinned ruff (so a new
  # release cannot fail an unchanged tree), the protocol and control tests,
  # shellcheck at warnings and errors (the scripts split argument lists on
  # purpose).
  scripts:
    executor: ubuntu
    steps:
      - checkout
      - run:
          name: Tools
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends pipx python3-pytest shellcheck
      - run:
          name: Python
          command: python3 -m py_compile $(git ls-files '*.py')
      - run:
          name: ruff
          command: pipx run ruff==0.17.0 check --isolated --select E9,F $(git ls-files '*.py')
      - run:
          name: Tests
          command: |
            python3 -m pytest tests/test_usb*.py --junitxml=.work/test-results/usb/junit.xml
            python3 -m pytest tests/test_fs*.py --junitxml=.work/test-results/fs/junit.xml
            python3 -m pytest tests/test_gdb*.py --junitxml=.work/test-results/gdb/junit.xml
      - run:
          name: Shell
          command: for f in $(git ls-files '*.sh'); do sh -n "$f" || exit 1; done
      - run:
          name: shellcheck
          command: shellcheck --severity=warning $(git ls-files '*.sh')
      - store_test_results:
          path: .work/test-results

workflows:
  ci:
    when: << pipeline.parameters.ci >>
    jobs:
      - image-ready:
          context: docker-hub
      - patches:
          requires: [image-ready]
          context: docker-hub
      - scripts
